name: Daily update (images, Top 10, Roach Report)

on:
  push:
    branches: [main]
    paths: ["stories.py", "arrests.py", "eats.py", "giving.py", "features.py", "cams.py", "places.py", "make_social.py"]
  schedule:
    - cron: "30 12 * * *"   # daily backstop, after the morning story scan
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow openpyxl imageio-ffmpeg
      - name: Generate images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
        run: python generate_images.py
      - name: Make social videos and captions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python make_social.py || true
      - name: Update Top 10 view counts
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python fetch_popularity.py
      - name: Update Roach Report (official DBPR closures)
        run: python fetch_closures.py || true
      - name: Rebuild site
        run: python build.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "floridamantimes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Daily update: images, social kits, Top 10, Roach Report"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          sleep 60
          python ping_indexnow.py || true
